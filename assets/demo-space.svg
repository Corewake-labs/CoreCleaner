<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="14">
  <!-- Simulated session with made-up numbers; the snapshot facts are macOS behavior. Loops every 18 s. -->
  <rect width="800" height="500" rx="12" fill="#1d1f21"/>
  <rect width="800" height="38" fill="#2f3235"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="40" cy="19" r="6" fill="#febc2e"/><circle cx="60" cy="19" r="6" fill="#28c840"/>
  <text x="400" y="24" text-anchor="middle" fill="#bfc3c7" font-family="-apple-system, Helvetica, sans-serif" font-size="13">claude: where the space went</text>
  <text x="24" y="72" xml:space="preserve"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#79c0ff">I emptied the Trash. Where did the rest of my disk go?</tspan></text>
  <text x="24" y="120" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">free before </tspan><tspan fill="#e3b341">41.2 GB</tspan><tspan fill="#d8dbde">  after </tspan><tspan fill="#e3b341">43.0 GB</tspan><tspan fill="#3fb950">  (+1.8 GB)</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.080;0.084;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="144" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">most of a full disk is not agent junk:</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.180;0.184;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="168" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    your files       215 GB</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.220;0.224;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="192" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    apps              33 GB</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.250;0.254;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="216" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    macOS and system  36 GB   </tspan><tspan fill="#8b949e">Spotlight index, Preboot, Recovery, swap</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.280;0.284;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="264" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">Time Machine local snapshots: 3, all from today</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.380;0.384;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="288" xml:space="preserve" opacity="0"><tspan fill="#8b949e">    macOS takes one before each backup, even to an external disk.</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.440;0.444;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="312" xml:space="preserve" opacity="0"><tspan fill="#8b949e">    It keeps them about a day and deletes them when an app needs space.</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.480;0.484;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="336" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    Want the space now? Run </tspan><tspan fill="#79c0ff">tmutil deletelocalsnapshots /</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.560;0.564;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="384" xml:space="preserve" opacity="0"><tspan fill="#8b949e">~ $ </tspan><tspan fill="#79c0ff">tmutil deletelocalsnapshots /</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.660;0.664;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="408" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">Deleted 3 Time Machine local snapshots for disk '/'</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.724;1" dur="18s" repeatCount="indefinite"/></text>
  <text x="24" y="456" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">free now </tspan><tspan fill="#e3b341">78.6 GB</tspan><tspan fill="#8b949e">   macOS will take new snapshots; that is normal</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.820;0.824;1" dur="18s" repeatCount="indefinite"/></text>
</svg>
