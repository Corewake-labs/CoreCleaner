<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" width="800" height="548" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="14">
  <!-- Simulated session with made-up numbers; the steps and wording follow the skill. Loops every 20 s. -->
  <rect width="800" height="548" rx="12" fill="#1d1f21"/>
  <rect width="800" height="38" fill="#2f3235"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/><circle cx="40" cy="19" r="6" fill="#febc2e"/><circle cx="60" cy="19" r="6" fill="#28c840"/>
  <text x="400" y="24" text-anchor="middle" fill="#bfc3c7" font-family="-apple-system, Helvetica, sans-serif" font-size="13">claude: corecleaner</text>
  <text x="24" y="72" xml:space="preserve"><tspan fill="#8b949e">~/projects $ </tspan><tspan fill="#79c0ff">claude</tspan></text>
  <text x="24" y="96" xml:space="preserve" opacity="0"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#79c0ff">my disk is full, use corecleaner</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.040;0.044;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="144" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">check, free        </tspan><tspan fill="#e3b341">41.2 GB free of 494 GB</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.100;0.104;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="168" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">scan with dua      </tspan><tspan fill="#8b949e">done in 3 min, read-only</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.170;0.174;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="192" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">inventory, plan    </tspan><tspan fill="#e3b341">38 items you could clear, about 1.7 GB</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.240;0.244;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="216" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    Sure junk        2 items   0.8 GB   </tspan><tspan fill="#8b949e">Go module cache, an old Codex clone</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.280;0.284;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="240" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    Quick decision  36 items   0.9 GB   </tspan><tspan fill="#8b949e">idle node_modules, duplicate downloads</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.310;0.314;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="264" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">    Shown only      71 items            </tspan><tspan fill="#8b949e">your data, protected, in use</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.340;0.344;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="288" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">Open the page, tick what goes, press Copy reply and paste it here.</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.400;0.404;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="336" xml:space="preserve" opacity="0"><tspan fill="#8b949e">&gt; </tspan><tspan fill="#79c0ff">CoreCleaner plan 4f2a9c1e0b7d</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.500;0.504;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="360" xml:space="preserve" opacity="0"><tspan fill="#8b949e">  </tspan><tspan fill="#79c0ff">Trash: c1a2b3c c4d5e6f c7a8b9d ...  Tool command: c0f1e2d</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.524;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="408" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">reply matches the plan: 21 ids, 0 problems</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.604;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="432" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">dry run: </tspan><tspan fill="#3fb950">21 ok</tspan><tspan fill="#d8dbde">, 0 refused, </tspan><tspan fill="#e3b341">1.2 GB</tspan><tspan fill="#d8dbde"> would go to the Trash</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.660;0.664;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="456" xml:space="preserve" opacity="0"><tspan fill="#d8dbde">  Move them? </tspan><tspan fill="#79c0ff">› Yes</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.720;0.724;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="480" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#3fb950">moved 21 items to the Trash</tspan><tspan fill="#8b949e">   undo works until you empty it</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.800;0.804;1" dur="20s" repeatCount="indefinite"/></text>
  <text x="24" y="504" xml:space="preserve" opacity="0"><tspan fill="#3fb950">● </tspan><tspan fill="#d8dbde">go clean -modcache  </tspan><tspan fill="#8b949e">(asked once more, then run)</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.860;0.864;1" dur="20s" repeatCount="indefinite"/></text>
</svg>
